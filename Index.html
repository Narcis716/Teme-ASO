<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #151518;
      --border: #252529;
      --text: #e8e8ec;
      --muted: #6b6b78;
      --accent: #c8b560;
      --accent-dim: rgba(200,181,96,0.12);
      --red: #e06060;
      --green: #5ec88a;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(200,181,96,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }

    header h1 em {
      font-style: italic;
      color: var(--accent);
    }

    header p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 12px 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent);
    }

    button.add-btn {
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 24px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button.add-btn:hover { opacity: 0.88; }
    button.add-btn:active { transform: scale(0.97); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 7px 18px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { color: var(--text); border-color: #3a3a42; }

    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .stats {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--muted);
      align-self: center;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, opacity 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover { border-color: #2e2e35; }

    .todo-item.completed { opacity: 0.45; }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .checkbox:hover { border-color: var(--accent); }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox.checked::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2px solid #0d0d0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .todo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .todo-title {
      font-size: 0.95rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: text-decoration 0.2s;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .priority-badge {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      font-weight: 500;
    }

    .priority-high   { background: rgba(224,96,96,0.15);  color: var(--red); }
    .priority-medium { background: rgba(200,181,96,0.12); color: var(--accent); }
    .priority-low    { background: rgba(94,200,138,0.12); color: var(--green); }

    .todo-date {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--red);
      background: rgba(224,96,96,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 0.95rem; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .bulk-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .text-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.2s;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .text-btn:hover { color: var(--text); }
  </style>
</head>
<body>

<header>
  <h1>Sarcini<em>.</em></h1>
  <p>Lista ta de activități</p>
</header>

<div class="container">
  <div class="add-form">
    <div class="form-row">
      <input type="text" id="newTitle" placeholder="Adaugă o sarcină nouă..." maxlength="200" />
    </div>
    <div class="form-row">
      <select id="newPriority">
        <option value="low">Prioritate scăzută</option>
        <option value="medium" selected>Prioritate medie</option>
        <option value="high">Prioritate înaltă</option>
      </select>
      <button class="add-btn" onclick="addTodo()">Adaugă</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Toate</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" onclick="setFilter('completed', this)">Finalizate</button>
    <span class="stats" id="stats"></span>
  </div>

  <div class="todo-list" id="todoList"></div>

  <div class="divider" id="divider" style="display:none"></div>
  <div class="bulk-actions" id="bulkActions" style="display:none">
    <button class="text-btn" onclick="clearCompleted()">Șterge finalizate</button>
  </div>
</div>

<script>
let todos = [];
let currentFilter = 'all';

async function fetchTodos() {
  const res = await fetch('/api/todos');
  todos = await res.json();
  render();
}

async function addTodo() {
  const title = document.getElementById('newTitle').value.trim();
  const priority = document.getElementById('newPriority').value;
  if (!title) return;

  const res = await fetch('/api/todos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, priority, isCompleted: false })
  });

  if (res.ok) {
    document.getElementById('newTitle').value = '';
    await fetchTodos();
  }
}

async function toggleTodo(id) {
  const res = await fetch(`/api/todos/${id}/toggle`, { method: 'PATCH' });
  if (res.ok) {
    const updated = await res.json();
    todos = todos.map(t => t.id === id ? updated : t);
    render();
  }
}

async function deleteTodo(id) {
  const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
  if (res.ok) {
    todos = todos.filter(t => t.id !== id);
    render();
  }
}

async function clearCompleted() {
  const completed = todos.filter(t => t.isCompleted);
  for (const t of completed) {
    await fetch(`/api/todos/${t.id}`, { method: 'DELETE' });
  }
  todos = todos.filter(t => !t.isCompleted);
  render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' });
}

function render() {
  const list = document.getElementById('todoList');
  const stats = document.getElementById('stats');
  const divider = document.getElementById('divider');
  const bulkActions = document.getElementById('bulkActions');

  const filtered = todos.filter(t => {
    if (currentFilter === 'active') return !t.isCompleted;
    if (currentFilter === 'completed') return t.isCompleted;
    return true;
  });

  const total = todos.length;
  const done = todos.filter(t => t.isCompleted).length;
  stats.textContent = `${done}/${total} finalizate`;

  const hasCompleted = todos.some(t => t.isCompleted);
  divider.style.display = hasCompleted ? '' : 'none';
  bulkActions.style.display = hasCompleted ? '' : 'none';

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <p>Nicio sarcină de afișat</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="todo-item ${t.isCompleted ? 'completed' : ''}">
      <div class="checkbox ${t.isCompleted ? 'checked' : ''}" onclick="toggleTodo(${t.id})"></div>
      <div class="todo-content">
        <span class="todo-title">${escapeHtml(t.title)}</span>
        <div class="todo-meta">
          <span class="priority-badge priority-${t.priority}">${t.priority === 'high' ? 'Înaltă' : t.priority === 'medium' ? 'Medie' : 'Scăzută'}</span>
          <span class="todo-date">${formatDate(t.createdAt)}</span>
        </div>
      </div>
      <button class="delete-btn" onclick="deleteTodo(${t.id})" title="Șterge">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('newTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

fetchTodos();
</script>
</body>
</html>
